[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "solitaire-based-game"
version = "1.0.0"
description = "A colourful terminal solitaire game written in pure Python."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Siti Abas" }]

[project.scripts]
solitaire = "solitaire.cli:main"

[tool.setuptools]
packages = ["solitaire"]
